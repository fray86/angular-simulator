<div class="messages-container">
  @for (msg of messageService.messages$ | async; track msg) {
    <ng-container [ngTemplateOutlet]="msgTemplate" [ngTemplateOutletContext]="{ item: msg }">
    </ng-container>
  }
</div>
<ng-template #msgTemplate let-msg="item">
  <div class="message-item">
    
    <fa-icon [icon]="faEnvelope" class="msg-icon" alt="message icon" width="60px" height="60px"></fa-icon>
    <div class="text-content-message">
      <h5 class="message-text fw-bold">{{ msg.type }}</h5>
      <span class="message-text fw-regular">{{ msg.message }}</span>
    </div>
    <button class="message-close-btn" [id]="'message-close-btn-' + msg.type" (click)="messageService.delete(msg)">
      <img src="/images/close-btn.svg" alt="close message">
    </button>
  </div>
</ng-template>
